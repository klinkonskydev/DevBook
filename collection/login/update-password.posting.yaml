name: Update Password
description: |-
  Requires $TOKEN (run Login first). Sets the password to the same value
  it already has, so it's safe to re-run without locking Login out on the
  next attempt.
method: POST
url: $BASE_URL/users/$USER_ID/update-password
body:
  content: |-
    {
      "old": "$DEMO_PASSWORD",
      "new": "$DEMO_PASSWORD"
    }
  content_type: application/json
headers:
- name: content-type
  value: application/json
- name: Authorization
  value: Bearer $TOKEN
