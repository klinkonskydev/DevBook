{{ define "following-modal" }}
<div class="modal fade" id="following-modal">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Seguindo</h2>
            </div>
            <div class="modal-body">
                {{ range .Following }}
                    <a href="/users/{{ .ID }}">{{ .Nickname }}</a> <br/>
                {{ else }}
                    <p class="text-muted text-center">
                        Não está seguindo ninguém por enquanto...
                    </p>
                {{ end }}
            </div>
        </div>
    </div>
</div>
{{ end }}
