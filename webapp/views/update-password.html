<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevBook - Atualização de Senha</title>
    <link href="/assets/css/bootstrap.css" rel="stylesheet" />
</head>

<body>
    {{ template "header" }}

    <div class="container-fluid">
        <div class="row mt-4">
            <div class="col-12">
                <h3>Atualização de Senha</h3>
                <form id="update-password-form">
                    <div class="form-group">
                        <label for="current-password">Senha Atual</label>
                        <input type="password" class="form-control" id="current-password" name="current-password"
                            placeholder="Insira a sua senha atual" required="required">
                    </div>
                    <div class="form-group">
                        <label for="new-password">Nova senha</label>
                        <input type="password" class="form-control" id="new-password" name="new-password"
                            placeholder="Insira a sua senha nova" required="required">
                    </div>
                    <div class="form-group">
                        <label for="confirm-password">Confirmar senha</label>
                        <input type="password" class="form-control" id="confirm-password" name="confirm-password"
                            placeholder="Confirme a nova senha" required="required">
                    </div>
                    <button class="btn btn-info" type="submit">
                        Atualizar Senha
                    </button>
                </form>
            </div>
        </div>
    </div>

    {{ template "footer" }}
    {{ template "scripts" }}

    <script src="/assets/js/user.js"></script>
</body>

</html>
